<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal QR | Smart Classroom V1</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ></script>

  <style>
    :root {
      --primary: #3157c8;
      --primary-dark: #2444a1;
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #dde4ef;
      --shadow: 0 18px 45px rgba(35, 54, 96, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e4ebff 0, transparent 35%),
        linear-gradient(180deg, #f9fbff, var(--bg));
      font-family: 'Sarabun', Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .header {
      padding: 28px 20px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .card {
      margin-top: 18px;
      padding: 24px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    #qrCode {
      display: inline-flex;
      min-width: 292px;
      min-height: 292px;
      align-items: center;
      justify-content: center;
      margin: 14px auto 18px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    #qrCode img,
    #qrCode canvas {
      max-width: 100%;
      height: auto !important;
    }

    .url-box {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      color: var(--text);
      background: #f8faff;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      text-align: left;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .button {
      min-height: 48px;
      padding: 12px 14px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .button:hover {
      background: var(--primary-dark);
    }

    .button.secondary {
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
    }

    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .message {
      margin-top: 14px;
      color: #9b2c2c;
      font-size: 14px;
    }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
    }

    .loading-box {
      padding: 24px 32px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      border: 4px solid #e8ecf4;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .page {
        width: 100%;
        max-width: none;
      }

      .header {
        color: #000;
        background: #fff;
        box-shadow: none;
        border: 1px solid #ddd;
      }

      .card {
        box-shadow: none;
      }

      .buttons,
      .url-box,
      .note,
      .message {
        display: none !important;
      }
    }

    @media (max-width: 440px) {
      .page {
        padding: 12px 12px 28px;
      }

      .header {
        margin: -12px -12px 0;
        border-radius: 0 0 22px 22px;
      }

      .card {
        padding: 20px 14px;
      }

      #qrCode {
        min-width: 250px;
        min-height: 250px;
        padding: 12px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>กำลังสร้าง QR Code...</div>
    </div>
  </div>

  <main class="page">
    <header class="header">
      <h1>📱 Student Portal QR</h1>
      <p>สแกนเพื่อเข้าสู่หน้าดูคะแนนและเปอร์เซ็นต์การเข้าเรียน</p>
    </header>

    <section class="card">
      <h2>Smart Classroom V1</h2>

      <div id="qrCode"></div>

      <input
        id="studentUrl"
        class="url-box"
        type="text"
        readonly
        aria-label="Student Portal URL"
      >

      <div class="buttons">
        <button class="button" type="button" onclick="copyUrl()">
          คัดลอกลิงก์
        </button>

        <button class="button secondary" type="button" onclick="window.print()">
          พิมพ์ QR Code
        </button>
      </div>

      <p class="note">
        นักเรียนทุกคนใช้ QR Code เดียวกัน แล้วกรอก ID และ PIN ของตนเอง
      </p>

      <div class="message" id="message"></div>
    </section>
  </main>

  <script>
    function hasAppsScript() {
      return typeof google !== 'undefined' &&
        google.script &&
        google.script.run;
    }

    function showLoading(show) {
      document.getElementById('loading').style.display =
        show ? 'flex' : 'none';
    }

    function showMessage(message) {
      document.getElementById('message').textContent =
        message || '';
    }

    function buildQrCode(url) {
      const container = document.getElementById('qrCode');

      container.innerHTML = '';

      if (typeof QRCode !== 'function') {
        showMessage('ไม่สามารถโหลดตัวสร้าง QR Code ได้');
        return;
      }

      new QRCode(container, {
        text: url,
        width: 260,
        height: 260,
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function loadStudentUrl() {
      showMessage('');

      if (!hasAppsScript()) {
        showMessage(
          'กรุณาเปิดหน้านี้ผ่าน Google Apps Script Web App'
        );
        return;
      }

      showLoading(true);

      google.script.run
        .withSuccessHandler(function(response) {
          showLoading(false);

          if (!response || response.success !== true) {
            showMessage(
              response && response.message
                ? response.message
                : 'ไม่สามารถสร้างลิงก์ Student Portal ได้'
            );
            return;
          }

          const url =
            response.data && response.data.url
              ? response.data.url
              : '';

          if (!url) {
            showMessage('ไม่พบลิงก์ Student Portal');
            return;
          }

          document.getElementById('studentUrl').value = url;
          buildQrCode(url);
        })
        .withFailureHandler(function(error) {
          showLoading(false);

          showMessage(
            'เกิดข้อผิดพลาด: ' +
            (error && error.message
              ? error.message
              : String(error || 'ไม่ทราบสาเหตุ'))
          );
        })
        .getStudentPortalUrl();
    }

    async function copyUrl() {
      const url = document.getElementById('studentUrl').value;

      if (!url) {
        showMessage('ยังไม่มีลิงก์ให้คัดลอก');
        return;
      }

      try {
        await navigator.clipboard.writeText(url);
        showMessage('คัดลอกลิงก์เรียบร้อย');
      } catch (error) {
        const input = document.getElementById('studentUrl');
        input.select();
        document.execCommand('copy');
        showMessage('คัดลอกลิงก์เรียบร้อย');
      }
    }

    window.addEventListener('load', loadStudentUrl);
  </script>
</body>
</html>
