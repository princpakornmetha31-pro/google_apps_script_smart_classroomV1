<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | Smart Classroom V1</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#3157c8;--primary-dark:#2444a1;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--border:#dfe5ef;--shadow:0 18px 45px rgba(35,54,96,.12)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(circle at top left,#e4ebff 0,transparent 35%),linear-gradient(180deg,#f8faff 0%,var(--bg) 100%);font-family:'Sarabun',Arial,sans-serif}
    button,input{font:inherit}.page{width:min(100%,520px);margin:0 auto;padding:24px 16px 40px}.brand{padding:28px 20px;color:#fff;text-align:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:24px;box-shadow:var(--shadow)}
    .brand h1{margin:0;font-size:28px}.brand p{margin:8px 0 0;opacity:.9}.card{margin-top:18px;padding:24px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
    .card h2{margin:0 0 6px;font-size:22px}.subtitle{margin:0 0 22px;color:var(--muted);font-size:14px}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-weight:600}
    .field input{width:100%;min-height:50px;padding:12px 14px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:13px;outline:none}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(49,87,200,.12)}
    .login-button{width:100%;min-height:52px;margin-top:4px;padding:12px 16px;color:#fff;background:var(--primary);border:0;border-radius:14px;cursor:pointer;font-weight:700}.login-button:hover{background:var(--primary-dark)}.login-button:disabled{cursor:not-allowed;opacity:.65}
    .hint{margin:16px 0 0;color:var(--muted);text-align:center;font-size:13px}.result{display:none}.student-header{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .avatar{display:grid;width:56px;height:56px;flex:0 0 56px;place-items:center;color:#fff;background:linear-gradient(135deg,#3157c8,#7c3aed);border-radius:50%;font-size:24px;font-weight:700}.student-name{margin:0;font-size:21px}.student-id{margin:3px 0 0;color:var(--muted);font-size:14px}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.summary-box{padding:18px 14px;text-align:center;background:#f8faff;border:1px solid var(--border);border-radius:17px}.summary-label{color:var(--muted);font-size:13px}.summary-value{margin-top:6px;color:var(--primary);font-size:30px;font-weight:700;overflow-wrap:anywhere}
    .logout-button{width:100%;min-height:46px;margin-top:18px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:13px;cursor:pointer;font-weight:600}.message{display:none;margin-top:14px;padding:12px 14px;text-align:center;border-radius:12px;font-size:14px}.message.error{display:block;color:#8f2424;background:#fee9e9;border:1px solid #facaca}
    .loading{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:20px;background:rgba(255,255,255,.82);backdrop-filter:blur(4px)}.loading-box{width:min(100%,280px);padding:24px;text-align:center;background:#fff;border-radius:18px;box-shadow:var(--shadow)}
    .spinner{width:42px;height:42px;margin:0 auto 12px;border:4px solid #e8ecf4;border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:420px){.page{padding:12px 12px 28px}.brand{margin:-12px -12px 0;border-radius:0 0 22px 22px}.card{padding:20px 16px}.summary-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadingText">กำลังตรวจสอบข้อมูล...</div></div></div>
  <main class="page">
    <section class="brand"><h1>🎓 Smart Classroom</h1><p>Student Portal V1</p></section>
    <section class="card" id="loginCard">
      <h2>เข้าสู่ระบบนักเรียน</h2>
      <p class="subtitle">กรอกรหัสนักเรียนและ PIN เพื่อดูคะแนนและเปอร์เซ็นต์การเข้าเรียนของตนเอง</p>
      <div class="field"><label for="studentId">รหัสนักเรียน</label><input id="studentId" type="text" autocomplete="username" placeholder="ตัวอย่าง A1072601"></div>
      <div class="field"><label for="studentPin">PIN</label><input id="studentPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="กรอก PIN"></div>
      <button class="login-button" id="loginButton" type="button" onclick="loginStudent()">เข้าสู่ระบบ</button>
      <div class="message" id="message"></div>
      <p class="hint">หน้านี้แสดงเฉพาะข้อมูลของผู้ที่กรอก ID และ PIN ถูกต้อง</p>
    </section>
    <section class="card result" id="resultCard">
      <div class="student-header"><div class="avatar" id="avatar">S</div><div><h2 class="student-name" id="studentName">นักเรียน</h2><p class="student-id" id="studentIdDisplay"></p></div></div>
      <div class="summary-grid">
        <div class="summary-box"><div class="summary-label">คะแนนสอบ</div><div class="summary-value" id="scoreValue">0</div></div>
        <div class="summary-box"><div class="summary-label">เปอร์เซ็นต์การเข้าเรียน</div><div class="summary-value" id="attendanceValue">0%</div></div>
      </div>
      <button class="logout-button" type="button" onclick="logoutStudent()">ออกจากหน้าข้อมูล</button>
    </section>
  </main>
  <script>
    function hasAppsScript(){return typeof google!=='undefined'&&google.script&&google.script.run}
    function showLoading(show,text){document.getElementById('loadingText').textContent=text||'กำลังดำเนินการ...';document.getElementById('loading').style.display=show?'flex':'none';document.getElementById('loginButton').disabled=show}
    function showMessage(message){const el=document.getElementById('message');el.textContent=message||'';el.className='message error'}
    function clearMessage(){const el=document.getElementById('message');el.textContent='';el.className='message'}
    function getErrorMessage(error){return error&&error.message?error.message:String(error||'ไม่ทราบสาเหตุ')}
    function loginStudent(){clearMessage();const id=document.getElementById('studentId').value.trim();const pin=document.getElementById('studentPin').value.trim();if(!id){showMessage('กรุณากรอกรหัสนักเรียน');return}if(!pin){showMessage('กรุณากรอก PIN');return}if(!hasAppsScript()){showMessage('กรุณาเปิดหน้านี้ผ่าน Google Apps Script Web App');return}showLoading(true,'กำลังตรวจสอบรหัสนักเรียนและ PIN...');google.script.run.withSuccessHandler(function(response){showLoading(false);if(!response||response.success!==true){showMessage(response&&response.message?response.message:'เข้าสู่ระบบไม่สำเร็จ');return}showStudentResult(response.data||{})}).withFailureHandler(function(error){showLoading(false);showMessage('ไม่สามารถติดต่อระบบได้: '+getErrorMessage(error))}).getStudentPortal(id,pin)}
    function showStudentResult(student){const name=student.name||student.nickname||'นักเรียน';document.getElementById('studentName').textContent=name;document.getElementById('studentIdDisplay').textContent='รหัสนักเรียน: '+(student.id||'');document.getElementById('scoreValue').textContent=Number(student.score)||0;document.getElementById('attendanceValue').textContent=student.attendance||'0%';document.getElementById('avatar').textContent=String(name).trim().charAt(0).toUpperCase()||'S';document.getElementById('loginCard').style.display='none';document.getElementById('resultCard').style.display='block';document.getElementById('studentPin').value='';clearMessage()}
    function logoutStudent(){document.getElementById('resultCard').style.display='none';document.getElementById('loginCard').style.display='block';document.getElementById('studentId').value='';document.getElementById('studentPin').value='';clearMessage();document.getElementById('studentId').focus()}
    document.getElementById('studentPin').addEventListener('keydown',function(event){if(event.key==='Enter'){loginStudent()}});document.getElementById('studentId').addEventListener('keydown',function(event){if(event.key==='Enter'){document.getElementById('studentPin').focus()}})
  </script>
</body>
</html>
